# Copy to multiuser/env.yaml (git-ignored) and fill in. Passed to Cloud Run by `make deploy-friends`.

# The service's public URL. Cloud Run URLs are predictable: https://<service>-<project hash>-<region code>.a.run.app
PUBLIC_URL: "https://keep-tasks-friends-xxxxxxxxxx-ew.a.run.app"
# Random, 32+ chars. Signs sign-in tokens and encrypts the token store; changing it signs everyone out.
# python -c "import secrets; print(secrets.token_urlsafe(32))"
SERVER_KEY: ""
# Google OAuth client of type *Web application*, redirect URI <PUBLIC_URL>/auth/callback
OAUTH_CLIENT_ID: ""
OAUTH_CLIENT_SECRET: ""

OWNER_EMAIL: "you@gmail.com"
# Comma-separated, at most MAX_FRIENDS (settings.py). Only seeds the allowlist on the first start;
# after that, ask your AI app to add or remove friends (friends_add, friends_remove), no redeploy.
FRIEND_EMAILS: ""
# What friends get. keep is owner-only and can't be listed here.
FRIEND_SERVICES: "tasks,gmail,outlook"
# Tool calls, not messages: one message to Claude often makes 2-10 calls. 300/day is ~30-100 messages.
FRIEND_DAILY_CALLS: "300"
# Kill switch: "false" cuts off every friend at once, the owner keeps working
FRIENDS_ENABLED: "true"

# The Azure app from `make env-outlook`; each user links their own mailbox with outlook_connect
OUTLOOK_CLIENT_ID: ""
# Optional, owner-only Google Keep. Best left out: the master token has broad access to your Google
# account, and the personal server already gives you Keep.
# KEEP_EMAIL: ""
# KEEP_MASTER_TOKEN: ""

# firestore (default) or memory (local testing; forgets everything on restart)
STORE: "firestore"
